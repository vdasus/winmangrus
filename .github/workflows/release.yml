# On a tag push (v1.2.3): builds the Native AOT release and creates the GitHub release with exe, DLL, zip and notes
# generated from the commit subjects since the previous tag (.github/release-notes.ps1).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the previous tag and the commits since it

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches version.txt
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version.txt ($v)" }

      - name: Publish
        run: dotnet publish -c Release -o publish -p:NoVersionBump=true

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          ./.github/release-notes.ps1 $env:GITHUB_REF_NAME > notes.md
          gh release create $env:GITHUB_REF_NAME publish/winmangrus.exe publish/VirtualDesktopAccessor.dll "publish/winmangrus-$v-win-x64.zip" --title "winmangrus $v" --notes-file notes.md
